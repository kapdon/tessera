name: Publish Docker Image

run-name: Docker image (${{ inputs.ref || github.ref_name }})

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "Dockerfile"
      - "assets/**"
      - "bin/**"
      - "next.config.mjs"
      - "package-lock.json"
      - "package.json"
      - "postcss.config.js"
      - "public/**"
      - "runtime/**"
      - "scripts/**"
      - "server.ts"
      - "src/**"
      - "tailwind.config.ts"
      - "tsconfig*.json"
  pull_request:
    branches:
      - dev
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "Dockerfile"
      - "assets/**"
      - "bin/**"
      - "next.config.mjs"
      - "package-lock.json"
      - "package.json"
      - "postcss.config.js"
      - "public/**"
      - "runtime/**"
      - "scripts/**"
      - "server.ts"
      - "src/**"
      - "tailwind.config.ts"
      - "tsconfig*.json"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build. Defaults to the workflow branch.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tessera-docker
          cache-to: type=gha,mode=max,scope=tessera-docker
