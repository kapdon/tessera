services:
  tessera:
    container_name: tessera
    image: ${TESSERA_IMAGE:-ghcr.io/kapdon/tessera:dev}
    pull_policy: ${TESSERA_PULL_POLICY:-always}
    ports:
      - "32123:32123"
    environment:
      TESSERA_HOST: 0.0.0.0
    volumes:
      # Bind mounts keep each data area easy to inspect and edit on the host.
      - ./data/config:/home/tessera/.config
      - ./data/local:/home/tessera/.local
      - ./data/gitconfig:/home/tessera/.gitconfig
      - ./data/ssh:/home/tessera/.ssh
      - ./data/codex:/home/tessera/.codex
      - ./data/tessera:/home/tessera/.tessera
      - ./workspaces:/home/tessera/workspaces
      # Docker-managed alternative: replace the bind mounts above with:
      # - tessera-home:/home/tessera
      # Optional: keep workspace checkouts in a separate named volume:
      # - tessera-workspaces:/home/tessera/workspaces
    restart: unless-stopped

# volumes:
#   tessera-home:
#   tessera-workspaces:
